<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="冰箱管家">
  <!-- 可爱的小猪头：圆脸、尖耳朵、大鼻子、腮红 -->
  <g stroke="#d9668a" stroke-width="2" stroke-linejoin="round">
    <!-- 耳朵（画在脸后面） -->
    <path d="M14 26 C9 16 9 8 12.5 6.5 C17 5.5 24 10 28 15 Z" fill="#ffb3c7"/>
    <path d="M50 26 C55 16 55 8 51.5 6.5 C47 5.5 40 10 36 15 Z" fill="#ffb3c7"/>
    <!-- 脸 -->
    <ellipse cx="32" cy="36" rx="24" ry="22" fill="#ffc8d6"/>
    <!-- 鼻子 -->
    <ellipse cx="32" cy="44" rx="11" ry="7.5" fill="#ff9bb6"/>
  </g>
  <!-- 耳朵里面 -->
  <path d="M15.5 21 C13 15 13.5 10.5 15 10 C17.5 9.8 21.5 12.5 24 15.5 Z" fill="#ff9bb6"/>
  <path d="M48.5 21 C51 15 50.5 10.5 49 10 C46.5 9.8 42.5 12.5 40 15.5 Z" fill="#ff9bb6"/>
  <!-- 鼻孔 -->
  <ellipse cx="28" cy="44" rx="2.2" ry="3.2" fill="#c24d74"/>
  <ellipse cx="36" cy="44" rx="2.2" ry="3.2" fill="#c24d74"/>
  <!-- 眼睛（带高光） -->
  <ellipse cx="22.5" cy="31" rx="3.4" ry="4" fill="#3b2a33"/>
  <ellipse cx="41.5" cy="31" rx="3.4" ry="4" fill="#3b2a33"/>
  <circle cx="23.8" cy="29.5" r="1.3" fill="#fff"/>
  <circle cx="42.8" cy="29.5" r="1.3" fill="#fff"/>
  <!-- 腮红 -->
  <ellipse cx="14.5" cy="40" rx="4.5" ry="2.8" fill="#ff7fa3" opacity=".55"/>
  <ellipse cx="49.5" cy="40" rx="4.5" ry="2.8" fill="#ff7fa3" opacity=".55"/>
  <!-- 小嘴巴 -->
  <path d="M29 53.5 Q32 56 35 53.5" fill="none" stroke="#c24d74" stroke-width="1.6" stroke-linecap="round"/>
</svg>
